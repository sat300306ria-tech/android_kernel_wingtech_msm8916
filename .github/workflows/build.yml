name: Build Redmi2 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            gcc \
            g++ \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            python3 \
            python-is-python3 
            

      - name: Show toolchain
        run: |
          gcc --version
          arm-linux-gnueabi-gcc --version

      - name: Configure
        run: |
          mkdir -p out
          make O=out \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabi- \
            lineageos_wt88047_defconfig

      - name: Build
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabi-

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Redmi2-Kernel
          path: |
            out/arch/arm/boot/zImage
            out/arch/arm/boot/dts/
