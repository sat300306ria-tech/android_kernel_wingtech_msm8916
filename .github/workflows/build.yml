name: Build Redmi2 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            gcc-arm-linux-gnueabi

      - name: Configure kernel
        run: |
          mkdir -p out
          make O=out ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- lineageos_wt88047_defconfig

      - name: Build kernel
        run: |
          make -j1 \
            O=out \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            V=1

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi2-Kernel
          path: out/arch/arm/boot/
