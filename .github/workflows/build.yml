name: Build Redmi2 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libelf-dev libssl-dev gcc-arm-linux-gnueabi

      - name: Configure
        run: |
          mkdir -p out
          make O=out ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- lineageos_wt88047_defconfig

      - name: Build
        run: |
          make -j$(nproc) O=out ARCH=arm CROSS_COMPILE=arm-linux-gnueabi-

      - uses: actions/upload-artifact@v4
        with:
          name: Redmi2-Kernel
          path: out/arch/arm/boot/
