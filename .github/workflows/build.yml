name: Build Redmi2 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
  run: |
    sudo apt update
    sudo apt install -y \
      bc \
      bison \
      build-essential \
      flex \
      git \
      libssl-dev \
      wget

       - name: Download GCC 4.9
  run: |
    wget https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-linux-gnueabi/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz
    tar -xf gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz

      - name: Configure kernel
        run: |
          mkdir -p out
          make O=out ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- lineageos_wt88047_defconfig

      - name: Build kernel
  run: |
    export PATH=$PWD/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi/bin:$PATH
    make -j$(nproc) \
      O=out \
      ARCH=arm \
      CROSS_COMPILE=arm-linux-gnueabi- \
      V=1

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi2-Kernel
          path: out/arch/arm/boot/
