name: Build Redmi2 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python2 \
            unzip \
            wget

      - name: Patch old kernel for GCC 10+
        run: |
          sed -i 's/-Wall/-Wall -fcommon/g' Makefile || true
          sed -i 's/-Werror//g' Makefile || true

      - name: Configure
        run: |
          mkdir -p out
          make O=out \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabi- \
            lineageos_wt88047_defconfig

      - name: Build Kernel
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabi-

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Redmi2-Kernel
          path: |
            out/arch/arm/boot/zImage
            out/arch/arm/boot/dts/**/*.dtb
