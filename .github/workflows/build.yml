name: Build Redmi2 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            flex \
            git \
            make \
            unzip \
            xz-utils \
            python3 \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            wget

      - name: Download AOSP GCC 4.9
        run: |
          mkdir toolchain
          cd toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9

      - name: Configure
        run: |
          mkdir -p out
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
          make O=out ARCH=arm CROSS_COMPILE=$CROSS_COMPILE lineageos_wt88047_defconfig

      - name: Build Kernel
        run: |
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
          make -j$(nproc) \
            O=out \
            ARCH=arm \
            CROSS_COMPILE=$CROSS_COMPILE

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi2-Kernel
          path: |
            out/arch/arm/boot/zImage
            out/arch/arm/boot/dts
